baseURL: "https://libbyjenke.github.io/"
title: "Libby Jenke"

build:
  buildStats:
    enable: true
  cachebusters:
    - source: assets/hugo_stats\.json
      target: css
    - source: (postcss|tailwind)\.config\.js
      target: css
copyright: "© {year} Libby Jenke"
languageCode: en-us
defaultContentLanguage: en
summaryLength: 30
enableEmoji: true
enableRobotsTXT: true

module:
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

menus:
  main:
    - name: Bio
      pageRef: /bio
      weight: 10
    - name: Publications
      pageRef: /publication
      weight: 20
    - name: Tools
      pageRef: /tools
      weight: 30
    - name: Teaching
      pageRef: /teaching
      weight: 40
    - name: Contact
      pageRef: /contact
      weight: 50

params:
  appearance:
    mode: light
  header:
    navbar:
      enable: true
      fixed_to_top: true
      show_theme_chooser: false
      logo:
        text: "Libby Jenke"
  footer:
    text: "Libby Jenke · Quantitative UX Researcher at Meta"
  mysite:
    credit: true
    discovery: true

taxonomies:
  tag: tags
  publication_type: publication_types
  author: authors
